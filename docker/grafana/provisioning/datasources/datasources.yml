apiVersion: 1

datasources:
  - name: Prometheus
    uid: sismos-prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      httpMethod: POST

  - name: Alertmanager
    uid: sismos-alertmanager
    type: alertmanager
    access: proxy
    orgId: 1
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus

  - name: PostgreSQL
    uid: sismos-postgres
    type: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    user: sismos
    editable: false
    jsonData:
      database: sismos
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: sismos_dev_pwd
