[server]
root_url = %(protocol)s://%(domain)s/monitoring/grafana/
serve_from_sub_path = true

[security]
admin_email = grafana-admin@sismos.invalid
disable_gravatar = true

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[live]
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
