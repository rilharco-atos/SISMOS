global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-ipma'
  routes:
    - match:
        severity: critical
      receiver: 'email-ipma'
      repeat_interval: 1h

receivers:
  - name: 'email-ipma'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${SMTP_USER}'
        smarthost: '${SMTP_HOST}:${SMTP_PORT}'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        require_tls: true
        send_resolved: true
        headers:
          subject: '[SISMOS] {{ .GroupLabels.alertname }} — {{ .Status | toUpper }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
